# OFFWORLD build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "offworld"                 # the build's file names: offworld-0.1.fwsc, build/host/offworld_host
title = "OFFWORLD"                # the name people see (firmware hubs)
id_prefix = "FM-1_575"            # package identity: dev FM-1_57500, releases FM-1_575 + XXYYZZ (CHORD RUN 571, GRAIN PIANO 572, INSERT COIN 573, SIX MACHINES 574)
usb_manufacturer = "swtdr34mz"
usb_product = "OFFWORLD FM-1"     # the USB name (the MIDI port in a DAW)
o2 = ["dsp/engine.c"]             # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
backup = true                     # backup and restore of the settings
tagline = "A drone synth: colossal 80s brass, endless reverb, rain on neon"
repo = "https://github.com/swtdr34mz-afk/OFFWORLD"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A drone synth in the spirit of the great 80s sci-fi scores: two detuned saws per voice, a brass filter envelope that swells, ensemble chorus and a reverb up to 30 seconds with FREEZE. Four macro knobs (SWELL, DRIFT, SPACE, RAIN) that rest on sweetspots, a DRONE latch with a deep root below the chord, an EPIC mode (root, fifth and octave from one finger) and synthesized rain and thunder. On the screen: a city at night in the rain."
tags = ["synth", "ambient"]
install = "https://github.com/swtdr34mz-afk/OFFWORLD/releases"
screenshot = "site/img/screen-main.png"
